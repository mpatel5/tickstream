[build-system]
requires = ["setuptools>=64", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "tickstream"
version = "0.1.0"
description = "Streaming sketches and pair statistics for market data, with a C++ core and Python bindings"
readme = "README.md"
authors = [{ name = "Mitesh Patel" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
live = ["websockets>=12"]
yahoo = ["yfinance>=0.2"]
all = ["websockets>=12", "yfinance>=0.2"]
test = ["pytest>=7", "websockets>=12", "statsmodels>=0.14"]  # statsmodels: reference check only

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
