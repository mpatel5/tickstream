[build-system]
requires = ["setuptools>=64", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "tickstream"
version = "0.1.0"
description = "Streaming sketches and pair statistics for market data, with a C++ core and Python bindings"
readme = "README.md"
authors = [{ name = "Mitesh Patel" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["tickstream"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
